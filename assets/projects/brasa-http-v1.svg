<svg xmlns="http://www.w3.org/2000/svg" width="570" height="270" viewBox="0 0 570 270" role="img" aria-labelledby="t d">
  <title id="t">BrasaHTTP</title><desc id="d">Animated project card showing an HTTP request traversing a server pipeline.</desc>
  <defs><linearGradient id="b"><stop stop-color="#15100f"/><stop offset="1" stop-color="#181022"/></linearGradient><linearGradient id="a" x1="0" x2="1"><stop stop-color="#fb7185"/><stop offset="1" stop-color="#f59e0b"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="3" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <style>.s{font-family:Inter,system-ui,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.edge{stroke:url(#a);stroke-width:1.5;fill:none;stroke-dasharray:120 700;animation:e 5s linear infinite}.pipe{fill:none;stroke:#9f4961;stroke-width:2;stroke-dasharray:5 8;animation:p 1.8s linear infinite}.node{animation:n 2.8s ease-in-out infinite}@keyframes e{to{stroke-dashoffset:-820}}@keyframes p{to{stroke-dashoffset:-39}}@keyframes n{50%{opacity:.45}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  <rect x="4" y="4" width="562" height="262" rx="20" fill="url(#b)" stroke="#49302f"/><rect class="edge" x="4" y="4" width="562" height="262" rx="20"/>
  <text class="m" x="28" y="36" fill="#fda4af" font-size="11" letter-spacing="1.7">06 / NETWORKING</text><text class="m" x="470" y="35" fill="#34d399" font-size="9">200 OK</text>
  <text class="s" x="28" y="72" fill="#f8fafc" font-size="23" font-weight="750">BrasaHTTP</text>
  <text class="s" x="28" y="104" fill="#94a3b8" font-size="13">A minimal web server grown from raw sockets,</text><text class="s" x="28" y="124" fill="#94a3b8" font-size="13">standard library first — from parsing to TLS.</text>
  <g class="m" font-size="10"><rect x="28" y="148" width="62" height="25" rx="7" fill="#28101c" stroke="#9f4961"/><text x="41" y="165" fill="#ffe4e6">Python</text><rect x="98" y="148" width="55" height="25" rx="7" fill="#2b1b0b" stroke="#a16207"/><text x="113" y="165" fill="#fef3c7">TCP</text><rect x="161" y="148" width="58" height="25" rx="7" fill="#28101c" stroke="#9f4961"/><text x="174" y="165" fill="#ffe4e6">HTTP</text><rect x="227" y="148" width="43" height="25" rx="7" fill="#2b1b0b" stroke="#a16207"/><text x="241" y="165" fill="#fef3c7">TLS</text></g>
  <g transform="translate(331 66)" class="m"><path class="pipe" d="M8 57H211"/><g font-size="8" text-anchor="middle"><g class="node"><rect x="0" y="35" width="49" height="45" rx="10" fill="#28101c" stroke="#9f4961"/><text x="24" y="61" fill="#ffe4e6">socket</text></g><g class="node"><rect x="58" y="35" width="49" height="45" rx="10" fill="#2b1b0b" stroke="#a16207"/><text x="82" y="61" fill="#fef3c7">parse</text></g><g class="node"><rect x="116" y="35" width="49" height="45" rx="10" fill="#28101c" stroke="#9f4961"/><text x="140" y="61" fill="#ffe4e6">route</text></g><g class="node"><rect x="174" y="35" width="49" height="45" rx="10" fill="#2b1b0b" stroke="#a16207"/><text x="198" y="61" fill="#fef3c7">200</text></g></g><circle r="5" fill="#fb7185" filter="url(#g)"><animateMotion dur="3.4s" repeatCount="indefinite" path="M8 57H211"/></circle><text x="4" y="23" fill="#64748b" font-size="9">GET /index HTTP/1.1</text><text x="149" y="101" fill="#34d399" font-size="9">response →</text></g>
  <text class="m" x="28" y="226" fill="#fda4af" font-size="11">FOLLOW THE REQUEST</text><path d="M174 222H208l-7-6m7 6-7 6" stroke="#fda4af" fill="none"/><text class="m" x="28" y="249" fill="#475569" font-size="9">socket • router • sessions • concurrency</text>
</svg>
