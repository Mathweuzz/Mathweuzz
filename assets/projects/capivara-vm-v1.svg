<svg xmlns="http://www.w3.org/2000/svg" width="570" height="270" viewBox="0 0 570 270" role="img" aria-labelledby="t d">
  <title id="t">CapivaraVM</title><desc id="d">Animated project card showing Java bytecode entering virtual machine stack frames.</desc>
  <defs><linearGradient id="b"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#151127"/></linearGradient><linearGradient id="a" x1="0" x2="1"><stop stop-color="#818cf8"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="3" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <style>.s{font-family:Inter,system-ui,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.edge{stroke:url(#a);stroke-width:1.5;fill:none;stroke-dasharray:120 700;animation:e 5.4s linear infinite}.code{stroke:#818cf8;stroke-dasharray:4 7;animation:p 2s linear infinite}.frame{animation:f 3.2s ease-in-out infinite}@keyframes e{to{stroke-dashoffset:-820}}@keyframes p{to{stroke-dashoffset:-33}}@keyframes f{50%{opacity:.45}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  <rect x="4" y="4" width="562" height="262" rx="20" fill="url(#b)" stroke="#323752"/><rect class="edge" x="4" y="4" width="562" height="262" rx="20"/>
  <text class="m" x="28" y="36" fill="#a5b4fc" font-size="11" letter-spacing="1.7">04 / VIRTUAL MACHINE</text><text class="m" x="465" y="35" fill="#64748b" font-size="9">52.0</text>
  <text class="s" x="28" y="72" fill="#f8fafc" font-size="23" font-weight="750">CapivaraVM</text>
  <text class="s" x="28" y="104" fill="#94a3b8" font-size="13">An interpreted JVM written in Python, targeting</text><text class="s" x="28" y="124" fill="#94a3b8" font-size="13">Java 8 class files without a JIT.</text>
  <g class="m" font-size="10"><rect x="28" y="148" width="62" height="25" rx="7" fill="#141a39" stroke="#4f46a5"/><text x="41" y="165" fill="#e0e7ff">Python</text><rect x="98" y="148" width="48" height="25" rx="7" fill="#0b2a36" stroke="#0e7490"/><text x="112" y="165" fill="#cffafe">JVM</text><rect x="154" y="148" width="76" height="25" rx="7" fill="#141a39" stroke="#4f46a5"/><text x="167" y="165" fill="#e0e7ff">Bytecode</text></g>
  <g transform="translate(337 51)" class="m"><rect x="0" y="5" width="75" height="140" rx="12" fill="#10162b" stroke="#4f46a5"/><text x="12" y="24" fill="#64748b" font-size="8">BYTECODE</text><g fill="#c7d2fe" font-size="9"><text x="12" y="46">iconst_1</text><text x="12" y="65">istore_0</text><text x="12" y="84">iload_0</text><text x="12" y="103">iadd</text><text x="12" y="122">ireturn</text></g><path class="code" d="M81 75H109"/><circle r="3" fill="#22d3ee" filter="url(#g)"><animateMotion dur="2s" repeatCount="indefinite" path="M81 75H109"/></circle><g transform="translate(115 8)"><rect class="frame" x="0" y="0" width="87" height="42" rx="9" fill="#0b2a36" stroke="#0e7490"/><rect class="frame" x="0" y="50" width="87" height="42" rx="9" fill="#141a39" stroke="#4f46a5"/><rect class="frame" x="0" y="100" width="87" height="42" rx="9" fill="#201431" stroke="#7c3aed"/><text x="13" y="25" fill="#a5f3fc" font-size="9">operand</text><text x="13" y="75" fill="#c7d2fe" font-size="9">locals</text><text x="13" y="125" fill="#ddd6fe" font-size="9">frame</text></g></g>
  <text class="m" x="28" y="226" fill="#a5b4fc" font-size="11">ENTER THE VM</text><path d="M135 222H169l-7-6m7 6-7 6" stroke="#a5b4fc" fill="none"/><text class="m" x="28" y="249" fill="#475569" font-size="9">classfile • frames • operand stack</text>
</svg>
