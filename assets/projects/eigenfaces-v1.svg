<svg xmlns="http://www.w3.org/2000/svg" width="570" height="270" viewBox="0 0 570 270" role="img" aria-labelledby="t d">
  <title id="t">Eigenfaces from scratch</title><desc id="d">Animated project card showing face vectors projected into a PCA subspace.</desc>
  <defs><linearGradient id="b"><stop stop-color="#0b0e20"/><stop offset="1" stop-color="#17102a"/></linearGradient><linearGradient id="a" x1="0" x2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="3" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <style>.s{font-family:Inter,system-ui,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.edge{stroke:url(#a);stroke-width:1.5;fill:none;stroke-dasharray:120 700;animation:e 5.5s linear infinite}.axis{stroke:#6d5bd0;stroke-width:1.5;stroke-dasharray:4 7;animation:p 2s linear infinite}.pt{animation:q 2.8s ease-in-out infinite}@keyframes e{to{stroke-dashoffset:-820}}@keyframes p{to{stroke-dashoffset:-33}}@keyframes q{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  <rect x="4" y="4" width="562" height="262" rx="20" fill="url(#b)" stroke="#332b4b"/><rect class="edge" x="4" y="4" width="562" height="262" rx="20"/>
  <text class="m" x="28" y="36" fill="#c4b5fd" font-size="11" letter-spacing="1.7">02 / COMPUTER VISION</text><text class="m" x="477" y="35" fill="#64748b" font-size="9">k = 80</text>
  <text class="s" x="28" y="72" fill="#f8fafc" font-size="23" font-weight="750">Eigenfaces from scratch</text>
  <text class="s" x="28" y="104" fill="#94a3b8" font-size="13">PCA, SVD and nearest neighbors — no OpenCV,</text><text class="s" x="28" y="124" fill="#94a3b8" font-size="13">no pretrained model, no hidden high-level API.</text>
  <g class="m" font-size="10"><rect x="28" y="148" width="58" height="25" rx="7" fill="#1c1435" stroke="#5b4db2"/><text x="41" y="165" fill="#ddd6fe">NumPy</text><rect x="94" y="148" width="47" height="25" rx="7" fill="#271226" stroke="#9d466d"/><text x="109" y="165" fill="#fbcfe8">PCA</text><rect x="149" y="148" width="47" height="25" rx="7" fill="#1c1435" stroke="#5b4db2"/><text x="164" y="165" fill="#ddd6fe">SVD</text><rect x="204" y="148" width="76" height="25" rx="7" fill="#271226" stroke="#9d466d"/><text x="217" y="165" fill="#fbcfe8">89.17%</text></g>
  <g transform="translate(350 62)"><rect x="0" y="8" width="72" height="88" rx="12" fill="#14152b" stroke="#5b4db2"/><g fill="#a78bfa"><circle cx="23" cy="38" r="6"/><circle cx="49" cy="38" r="6"/></g><path d="M21 68Q36 79 51 68M36 43V60" fill="none" stroke="#f5d0fe" stroke-width="3" stroke-linecap="round"/><text class="m" x="9" y="116" fill="#64748b" font-size="8">4096-D</text><path d="M83 52H127" stroke="#c4b5fd" stroke-dasharray="3 5"/><circle r="3" fill="#f472b6" filter="url(#g)"><animateMotion dur="2.4s" repeatCount="indefinite" path="M83 52H127"/></circle><g transform="translate(134 17)"><path class="axis" d="M0 78L64 0M0 78L77 70"/><g fill="#f472b6"><circle class="pt" cx="31" cy="48" r="4"/><circle class="pt" cx="47" cy="34" r="4"/><circle class="pt" cx="53" cy="57" r="4"/><circle class="pt" cx="66" cy="45" r="4"/></g><text class="m" x="23" y="98" fill="#64748b" font-size="8">PCA SPACE</text></g></g>
  <text class="m" x="28" y="226" fill="#c4b5fd" font-size="11">SEE THE MATHEMATICS</text><path d="M171 222H205l-7-6m7 6-7 6" stroke="#c4b5fd" fill="none"/>
  <text class="m" x="28" y="249" fill="#475569" font-size="9">400 faces • 40 identities • 80 components</text>
