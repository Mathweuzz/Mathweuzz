  <text class="s" x="28" y="72" fill="#f8fafc" font-size="23" font-weight="750">fuzzberon</text>
  <text class="s" x="28" y="104" fill="#94a3b8" font-size="13">A grammar-based, type-aware Oberon-07 fuzzer.</text><text class="s" x="28" y="124" fill="#94a3b8" font-size="13">Valid symbols and selectors instead of token soup.</text>
  <g class="m" font-size="10"><rect x="28" y="148" width="62" height="25" rx="7" fill="#092822" stroke="#0f766e"/><text x="41" y="165" fill="#ccfbf1">Python</text><rect x="98" y="148" width="65" height="25" rx="7" fill="#082532" stroke="#0e7490"/><text x="112" y="165" fill="#cffafe">Fuzzing</text><rect x="171" y="148" width="78" height="25" rx="7" fill="#092822" stroke="#0f766e"/><text x="184" y="165" fill="#ccfbf1">Oberon-07</text></g>
