<svg xmlns="http://www.w3.org/2000/svg" width="570" height="270" viewBox="0 0 570 270" role="img" aria-labelledby="t d">
  <title id="t">fuzzberon</title><desc id="d">Animated project card showing a typed grammar generating an Oberon abstract syntax tree.</desc>
  <defs><linearGradient id="b"><stop stop-color="#07151a"/><stop offset="1" stop-color="#0d1828"/></linearGradient><linearGradient id="a" x1="0" x2="1"><stop stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="3" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <style>.s{font-family:Inter,system-ui,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.edge{stroke:url(#a);stroke-width:1.5;fill:none;stroke-dasharray:120 700;animation:e 5s linear infinite}.tree{fill:none;stroke:#155e75;stroke-width:1.5;stroke-dasharray:3 5;animation:p 2.4s linear infinite}.node{animation:n 2.5s ease-in-out infinite}@keyframes e{to{stroke-dashoffset:-820}}@keyframes p{to{stroke-dashoffset:-32}}@keyframes n{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
