<svg xmlns="http://www.w3.org/2000/svg" width="570" height="270" viewBox="0 0 570 270" role="img" aria-labelledby="t d">
  <title id="t">Snake AI arena</title><desc id="d">Animated project card showing an AI agent traversing a game grid.</desc>
  <defs><linearGradient id="b"><stop stop-color="#07151b"/><stop offset="1" stop-color="#10152a"/></linearGradient><linearGradient id="a" x1="0" x2="1"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#818cf8"/></linearGradient><pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#334155" stroke-opacity=".65"/></pattern><filter id="g"><feGaussianBlur stdDeviation="3" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <style>.s{font-family:Inter,system-ui,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.edge{stroke:url(#a);stroke-width:1.5;fill:none;stroke-dasharray:120 700;animation:e 5.2s linear infinite}.path{fill:none;stroke:#2dd4bf;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:6 8;animation:p 2s linear infinite}@keyframes e{to{stroke-dashoffset:-820}}@keyframes p{to{stroke-dashoffset:-42}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
