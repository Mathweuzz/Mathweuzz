  <text class="s" x="28" y="72" fill="#f8fafc" font-size="23" font-weight="750">Snake AI arena</text>
  <text class="s" x="28" y="104" fill="#94a3b8" font-size="13">Three concurrent worlds compare graph search,</text><text class="s" x="28" y="124" fill="#94a3b8" font-size="13">reinforcement learning and neuroevolution.</text>
